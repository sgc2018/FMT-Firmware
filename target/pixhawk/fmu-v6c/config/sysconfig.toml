# FMT System Configuration File
# Pixhawk 6C quadcopter: 4 ESCs on FMU PWM OUT 1-4, SBUS receiver on RC IN,
# MAVLink UDP gateway on TELEM1, GNSS module on GPS1, debug console on TELEM3,
# PM02 power module on POWER1 (battery settings are parameters, see the end of this file).

# The target should match with BSP's target name
target = "Pixhawk 6C"

# Console Configuration
[console]
    [[console.devices]]
    type = "serial"
    name = "serial0"            # DEBUG port
    baudrate = 57600
    auto-switch = true

    [[console.devices]]
    type = "serial"
    name = "serial6"            # TELEM3
    baudrate = 57600
    auto-switch = true

    [[console.devices]]
    type = "mavlink"
    name = "mav_console"
    auto-switch = true

# Mavproxy Device Configuration
[mavproxy]
    [[mavproxy.devices]]
    chan = 0
    type = "serial"
    name = "serial1"            # TELEM1 -> MAVLink UDP gateway
    baudrate = 57600            # must match the gateway's serial baudrate

    [[mavproxy.devices]]
    chan = 0
    type = "usb"
    name = "usbd0"
    mirror = true               # use USB in parallel with TELEM1 instead of switching to it

# Pilot CMD Configuration
[pilot-cmd]
    # channel mapping for [yaw, throttle, roll, pitch]
    stick-channel = [4,3,1,2]

    [pilot-cmd.device]
    type = "rc"
    name = "rc"
    protocol = "sbus"           # auto/sbus/ppm
    channel-num = 16            # max supported channel: sbus:16, ppm:8
    sample-time = 0.05          # sample time in second (-1 for inherit)
    range = [1000,2000]

    [[pilot-cmd.mode]]
    mode = 5                    # Position mode
    channel = 5
    range = [1000,1300]

    [[pilot-cmd.mode]]
    mode = 4                    # Altitude mode
    channel = 5
    range = [1400,1600]

    [[pilot-cmd.mode]]
    mode = 3                    # Stabilize mode
    channel = 5
    range = [1700,2000]

    [[pilot-cmd.command]]
    type = 1                    # 1:event | 2:status
    cmd = 1002                  # FMS_Cmd_Disarm, triggered when the switch moves into range
    channel = 8                 # AT9S Pro: channel 6 is a knob, use a 2-position switch on channel 8
    range = [1800,2000]         # switch high (+1) = disarm

# Actuator Configuration
[actuator]
    [[actuator.devices]]
    protocol = "pwm"
    name = "aux_out"            # FMU PWM OUT
    freq = 400                  # pwm frequency in Hz

    [[actuator.mappings]]
    from = "control_out"
    to = "aux_out"
    chan-map = [[1,2,3,4],[1,2,3,4]]

# GNSS Configuration
[gnss]
    [[gnss.devices]]
    id = 0
    protocol = "ublox"          # ublox or nmea
    type = "serial"
    name = "serial2"            # GPS1
    auto-config = true
    baudrate = 38400            # NEO-M8N on this vehicle runs at 38400 (0 = auto detect)

# Battery (WisdomFarmer quad, 3S pack through a Holybro PM02 on POWER1)
# sysconfig.toml cannot carry parameters: they live in /sys/param.xml and are
# set from the console. Values applied and saved on 2026-10-06:
#   param set POWER BAT_V_DIV 10.39      # ADC mV -> pack mV, checked against a multimeter (12.5 V)
#   param set POWER BAT_A_PER_V 36.37    # PM02 current scale, 4 motors at idle read ~0.5 A
#   param set POWER BAT_N_CELLS 3        # enables cell voltage and state-of-charge estimation
#   param save
# QGC's Power page cannot configure this board (it needs PX4 BAT1_* parameters).
